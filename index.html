<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한자능력검정시험 학습 (8급~4급)</title>
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
<style>
  :root{
    --bg:#f6f5f1; --card:#ffffff; --ink:#2b2b2b; --muted:#7a7a7a;
    --accent:#8a3324; --accent2:#c65f3d; --line:#e3ddd2; --good:#2e7d32; --bad:#b3261e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh;
  }
  header{
    background:var(--accent); color:#fff; padding:18px 20px; text-align:center;
  }
  header h1{margin:0; font-size:1.3rem; letter-spacing:.5px;}
  header p{margin:4px 0 0; font-size:.8rem; opacity:.85;}
  nav.tabs{
    display:flex; gap:0; background:#fff; border-bottom:2px solid var(--line);
    position:sticky; top:0; z-index:5; overflow-x:auto;
  }
  nav.tabs button{
    flex:1; min-width:90px; padding:12px 6px; border:none; background:transparent;
    font-size:.85rem; font-weight:600; color:var(--muted); cursor:pointer; border-bottom:3px solid transparent;
  }
  nav.tabs button.active{color:var(--accent); border-bottom:3px solid var(--accent);}
  main{max-width:760px; margin:0 auto; padding:16px;}
  section.panel{display:none;}
  section.panel.active{display:block;}

  .level-box{
    background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:16px;
  }
  .level-box h2{font-size:.95rem; margin:0 0 10px;}
  .level-grid{display:flex; flex-wrap:wrap; gap:8px;}
  .level-chip{
    padding:6px 12px; border-radius:20px; border:1px solid var(--line); background:#faf8f4;
    font-size:.8rem; cursor:pointer; user-select:none; white-space:nowrap;
  }
  .level-chip.on{background:var(--accent); color:#fff; border-color:var(--accent);}
  .level-actions{margin-top:10px; display:flex; gap:8px; font-size:.78rem;}
  .level-actions a{color:var(--accent2); cursor:pointer; text-decoration:underline;}
  .count-badge{color:var(--muted); font-size:.78rem; margin-left:6px;}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; text-align:center;
    box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  .flash-wrap{display:flex; flex-direction:column; align-items:center; gap:14px;}
  .flash-face{
    width:100%; max-width:320px; height:280px; display:flex; align-items:center; justify-content:center;
    flex-direction:column; border-radius:16px; background:#fffdf8; border:1px solid var(--line);
    cursor:pointer; position:relative;
  }
  .flash-char{font-size:6rem; line-height:1;}
  .flash-level-tag{position:absolute; top:10px; left:14px; font-size:.7rem; color:var(--muted); background:#f1ece2; padding:2px 8px; border-radius:10px;}
  .flash-meaning{font-size:1.6rem; margin-top:10px;}
  .flash-eum{font-size:1.1rem; color:var(--accent2); margin-top:4px;}
  .flash-hint{font-size:.75rem; color:var(--muted); margin-top:14px;}
  .btn-row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
  button.pill{
    padding:10px 16px; border-radius:24px; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:.85rem; font-weight:600;
  }
  button.pill.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
  button.pill.good{background:#eaf5ea; color:var(--good); border-color:#bfe3bf;}
  button.pill.bad{background:#fcebe9; color:var(--bad); border-color:#f2c4bd;}
  .progress-line{font-size:.8rem; color:var(--muted); margin-top:6px;}

  .quiz-q{font-size:1rem; margin-bottom:14px; color:var(--muted);}
  .quiz-char{font-size:4.5rem; margin:10px 0;}
  .quiz-choices{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;}
  .quiz-choice{
    padding:14px 8px; border:1px solid var(--line); border-radius:10px; background:#fff; cursor:pointer; font-size:1rem;
  }
  .quiz-choice.correct{background:#eaf5ea; border-color:var(--good); color:var(--good);}
  .quiz-choice.wrong{background:#fcebe9; border-color:var(--bad); color:var(--bad);}
  .quiz-score{font-size:.85rem; color:var(--muted); margin-bottom:10px;}
  .quiz-summary{padding:20px 0;}

  .stroke-search{width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); font-size:1rem; margin-bottom:10px;}
  .stroke-list{display:flex; flex-wrap:wrap; gap:8px; max-height:140px; overflow-y:auto; margin-bottom:14px; padding:8px; border:1px solid var(--line); border-radius:10px; background:#fff;}
  .stroke-item{padding:6px 10px; border:1px solid var(--line); border-radius:8px; cursor:pointer; font-size:1.1rem; background:#faf8f4;}
  .stroke-item.sel{background:var(--accent); color:#fff;}
  #stroke-target{width:280px; height:280px; margin:0 auto; border:1px solid var(--line); border-radius:12px; background:#fffdf8;}
  .stroke-info{margin:10px 0;}
  .stroke-info .hun{font-size:1.3rem;} .stroke-info .eum{color:var(--accent2);}

  table.wrong-table{width:100%; border-collapse:collapse; font-size:.85rem; background:#fff; border-radius:10px; overflow:hidden;}
  table.wrong-table th, table.wrong-table td{border-bottom:1px solid var(--line); padding:8px 6px; text-align:center;}
  table.wrong-table th{background:#faf8f4; color:var(--muted); font-weight:600;}
  .wrong-empty{text-align:center; color:var(--muted); padding:40px 10px;}
  .top-actions{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .link-btn{background:none; border:none; color:var(--accent2); text-decoration:underline; cursor:pointer; font-size:.8rem;}
  footer{text-align:center; color:var(--muted); font-size:.72rem; padding:24px 10px 40px;}
</style>
</head>
<body>

<header>
  <h1>한자능력검정시험 학습장</h1>
  <p>사단법인 한국어문회 배정한자 기준 · 8급 ~ 4급 (총 1,000자)</p>
</header>

<nav class="tabs">
  <button data-tab="flash" class="active">플래시카드</button>
  <button data-tab="quiz">퀴즈</button>
  <button data-tab="stroke">필순쓰기</button>
  <button data-tab="wrong">오답노트</button>
</nav>

<main>

  <div class="level-box">
    <h2>학습 급수 선택 <span class="count-badge" id="selected-count"></span></h2>
    <div class="level-grid" id="level-grid"></div>
    <div class="level-actions">
      <a id="level-all">전체 선택</a>
      <a id="level-none">전체 해제</a>
    </div>
  </div>

  <!-- 플래시카드 -->
  <section class="panel active" id="panel-flash">
    <div class="card">
      <div class="flash-wrap">
        <div class="flash-face" id="flash-face">
          <span class="flash-level-tag" id="flash-level-tag"></span>
          <div class="flash-char" id="flash-char">-</div>
          <div id="flash-back" style="display:none;">
            <div class="flash-meaning" id="flash-hun"></div>
            <div class="flash-eum" id="flash-eum"></div>
            <div id="flash-extra" style="font-size:.85rem; color:var(--muted); margin-top:8px;"></div>
          </div>
        </div>
        <div class="flash-hint">카드를 클릭하면 훈/음이 보여요</div>
        <div class="btn-row">
          <button class="pill" id="flash-prev">◀ 이전</button>
          <button class="pill bad" id="flash-dont-know">모르겠어요</button>
          <button class="pill good" id="flash-know">알아요</button>
          <button class="pill" id="flash-next">다음 ▶</button>
        </div>
        <div class="btn-row">
          <button class="pill" id="flash-shuffle">🔀 섞기</button>
        </div>
        <div class="progress-line" id="flash-progress"></div>
      </div>
    </div>
  </section>

  <!-- 퀴즈 -->
  <section class="panel" id="panel-quiz">
    <div class="card">
      <div class="quiz-score" id="quiz-score">0 / 0 문제</div>
      <div id="quiz-body"></div>
    </div>
  </section>

  <!-- 필순쓰기 -->
  <section class="panel" id="panel-stroke">
    <div class="card">
      <input type="text" class="stroke-search" id="stroke-search" placeholder="한자, 훈, 음으로 검색 (예: 學, 배울, 학)">
      <div class="stroke-list" id="stroke-list"></div>
      <div class="stroke-info" id="stroke-info">한자를 선택하세요</div>
      <div id="stroke-target"></div>
      <div class="btn-row" style="margin-top:14px;">
        <button class="pill primary" id="stroke-animate">필순 애니메이션</button>
        <button class="pill" id="stroke-quiz">따라쓰기 연습</button>
      </div>
    </div>
  </section>

  <!-- 오답노트 -->
  <section class="panel" id="panel-wrong">
    <div class="card">
      <div class="top-actions">
        <span style="font-size:.85rem; color:var(--muted);" id="wrong-count-label">0개</span>
        <div>
          <button class="link-btn" id="wrong-review">오답만 복습하기</button>
          <button class="link-btn" id="wrong-clear">전체 삭제</button>
        </div>
      </div>
      <div id="wrong-body"></div>
    </div>
  </section>

</main>

<footer>
  데이터 출처: 사단법인 한국어문회(www.hanja.re.kr) 공개 배정한자 기준 · 훈음은 대표훈음 표기 · 필순 애니메이션은 hanzi-writer 오픈소스 라이브러리 사용
</footer>

 "order": 1000}]</script>
<script>
const ALL_DATA = JSON.parse(document.getElementById('hanja-data').textContent);
const LEVELS = ["8급","7급Ⅱ","7급","6급Ⅱ","6급","5급Ⅱ","5급","4급Ⅱ","4급"];
const LEVEL_COUNTS = {};
LEVELS.forEach(lv=> LEVEL_COUNTS[lv] = ALL_DATA.filter(d=>d.level===lv).length);

// ---------- storage helpers ----------
const LS_LEVEL_KEY = "hanja_app_levels_v1";
const LS_WRONG_KEY = "hanja_app_wrong_v1";
const LS_KNOWN_KEY = "hanja_app_known_v1";

function loadJSON(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; }
}
function saveJSON(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

let selectedLevels = loadJSON(LS_LEVEL_KEY, ["8급","7급Ⅱ","7급"]);
let wrongMap = loadJSON(LS_WRONG_KEY, {}); // char -> {count, level, hun, eum, last}
let knownSet = new Set(loadJSON(LS_KNOWN_KEY, []));

function saveKnown(){ saveJSON(LS_KNOWN_KEY, Array.from(knownSet)); }
function saveWrong(){ saveJSON(LS_WRONG_KEY, wrongMap); }
function saveLevels(){ saveJSON(LS_LEVEL_KEY, selectedLevels); }

function markWrong(entry){
  const key = entry.char;
  if(!wrongMap[key]){
    wrongMap[key] = {char:entry.char, level:entry.level, hun:entry.hun, eum:entry.eum, count:0, last:Date.now()};
  }
  wrongMap[key].count += 1;
  wrongMap[key].last = Date.now();
  saveWrong();
  renderWrongCount();
}
function clearWrongOne(char){ delete wrongMap[char]; saveWrong(); renderWrongTab(); }

function getFilteredData(){
  return ALL_DATA.filter(d => selectedLevels.includes(d.level));
}

// ---------- level UI ----------
const levelGrid = document.getElementById('level-grid');
LEVELS.forEach(lv=>{
  const chip = document.createElement('div');
  chip.className = 'level-chip' + (selectedLevels.includes(lv) ? ' on' : '');
  chip.textContent = lv + ' (' + LEVEL_COUNTS[lv] + ')';
  chip.dataset.level = lv;
  chip.addEventListener('click', ()=>{
    if(selectedLevels.includes(lv)){
      selectedLevels = selectedLevels.filter(x=>x!==lv);
    } else {
      selectedLevels.push(lv);
    }
    saveLevels();
    chip.classList.toggle('on');
    onLevelChange();
  });
  levelGrid.appendChild(chip);
});
document.getElementById('level-all').addEventListener('click', ()=>{
  selectedLevels = [...LEVELS]; saveLevels();
  document.querySelectorAll('.level-chip').forEach(c=>c.classList.add('on'));
  onLevelChange();
});
document.getElementById('level-none').addEventListener('click', ()=>{
  selectedLevels = []; saveLevels();
  document.querySelectorAll('.level-chip').forEach(c=>c.classList.remove('on'));
  onLevelChange();
});
function renderSelectedCount(){
  document.getElementById('selected-count').textContent =
    '· 선택된 한자 ' + getFilteredData().length + '자';
}

function onLevelChange(){
  renderSelectedCount();
  flashDeck = shuffle(getFilteredData().slice());
  flashIndex = 0;
  renderFlash();
  buildStrokeList();
}

// ---------- tabs ----------
document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('section.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab === 'wrong') renderWrongTab();
    if(btn.dataset.tab === 'quiz' && !quizActive) startQuizRound();
  });
});

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

// ---------- flashcards ----------
let flashDeck = shuffle(getFilteredData().slice());
let flashIndex = 0;
let flashFlipped = false;

function renderFlash(){
  const face = document.getElementById('flash-face');
  const back = document.getElementById('flash-back');
  const charEl = document.getElementById('flash-char');
  const hunEl = document.getElementById('flash-hun');
  const eumEl = document.getElementById('flash-eum');
  const tag = document.getElementById('flash-level-tag');
  const progress = document.getElementById('flash-progress');
  if(flashDeck.length === 0){
    charEl.textContent = '-';
    back.style.display='none';
    tag.textContent='';
    progress.textContent = '선택된 급수의 한자가 없습니다. 위에서 급수를 선택하세요.';
    return;
  }
  const item = flashDeck[flashIndex];
  charEl.textContent = item.char;
  hunEl.textContent = item.hun;
  eumEl.textContent = item.eum;
  const extraReadings = (item.readings || []).slice(1);
  document.getElementById('flash-extra').textContent =
    extraReadings.length ? '또 다른 훈음: ' + extraReadings.map(r => r.hun + ' ' + r.eum).join(', ') : '';
  tag.textContent = item.level;
  flashFlipped = false;
  back.style.display = 'none';
  progress.textContent = (flashIndex+1) + ' / ' + flashDeck.length + '   (아는 한자 ' + knownSet.size + '자 학습완료)';
}
document.getElementById('flash-face').addEventListener('click', ()=>{
  flashFlipped = !flashFlipped;
  document.getElementById('flash-back').style.display = flashFlipped ? 'block':'none';
});
document.getElementById('flash-next').addEventListener('click', ()=>{
  if(flashDeck.length===0) return;
  flashIndex = (flashIndex+1) % flashDeck.length;
  renderFlash();
});
document.getElementById('flash-prev').addEventListener('click', ()=>{
  if(flashDeck.length===0) return;
  flashIndex = (flashIndex-1+flashDeck.length) % flashDeck.length;
  renderFlash();
});
document.getElementById('flash-shuffle').addEventListener('click', ()=>{
  flashDeck = shuffle(flashDeck);
  flashIndex = 0;
  renderFlash();
});
document.getElementById('flash-know').addEventListener('click', ()=>{
  if(flashDeck.length===0) return;
  knownSet.add(flashDeck[flashIndex].char);
  saveKnown();
  document.getElementById('flash-next').click();
});
document.getElementById('flash-dont-know').addEventListener('click', ()=>{
  if(flashDeck.length===0) return;
  markWrong(flashDeck[flashIndex]);
  document.getElementById('flash-next').click();
});

// ---------- quiz ----------
let quizActive = false;
let quizPool = [];
let quizFullPool = [];
let quizIdx = 0;
let quizCorrect = 0;
const QUIZ_ROUND_SIZE = 10;

function startQuizRound(){
  const pool = getFilteredData();
  if(pool.length < 4){
    document.getElementById('quiz-body').innerHTML = '<p style="color:var(--muted)">퀴즈를 풀려면 최소 4자 이상의 한자가 선택되어야 합니다. 급수를 더 선택해주세요.</p>';
    document.getElementById('quiz-score').textContent = '';
    quizActive = false;
    return;
  }
  quizActive = true;
  quizFullPool = pool;
  quizPool = shuffle(pool.slice()).slice(0, Math.min(QUIZ_ROUND_SIZE, pool.length));
  quizIdx = 0;
  quizCorrect = 0;
  renderQuizQuestion();
}

function renderQuizQuestion(){
  const scoreEl = document.getElementById('quiz-score');
  const body = document.getElementById('quiz-body');
  if(quizIdx >= quizPool.length){
    scoreEl.textContent = '';
    body.innerHTML = '<div class="quiz-summary"><h3>결과: ' + quizCorrect + ' / ' + quizPool.length + '</h3>' +
      '<p style="color:var(--muted); font-size:.85rem;">틀린 문제는 오답노트에 자동 저장되었습니다.</p>' +
      '<div class="btn-row"><button class="pill primary" id="quiz-restart">다시 풀기</button></div></div>';
    document.getElementById('quiz-restart').addEventListener('click', startQuizRound);
    return;
  }
  scoreEl.textContent = (quizIdx+1) + ' / ' + quizPool.length + '   맞은 개수: ' + quizCorrect;
  const target = quizPool[quizIdx];
  const pool = quizFullPool;
  // question type rotates
  const qType = quizIdx % 3; // 0: char->eum, 1: char->hun+eum text, 2: hunEum->char
  let questionHtml = '';
  let choices = [];
  let correctVal;
  // 중복 값 제거하며 최대 n개 추출
  function pickUnique(arr, n){
    const out = [];
    for(const v of arr){
      if(!out.includes(v)) out.push(v);
      if(out.length === n) break;
    }
    return out;
  }
  const targetEums = (target.readings || []).map(r=>r.eum).concat(target.eum);
  const targetHuns = (target.readings || []).map(r=>r.hun).concat(target.hun);

  if(qType === 0){
    questionHtml = '<div class="quiz-q">이 한자의 음(소리)은 무엇일까요?</div><div class="quiz-char">'+target.char+'</div>';
    correctVal = target.eum;
    // 정답 한자의 복수 음까지 제외하고, 서로 다른 음만 3개 추출
    const distractors = pickUnique(shuffle(pool.filter(p=>!targetEums.includes(p.eum))).map(p=>p.eum), 3);
    choices = shuffle([correctVal, ...distractors]);
  } else if(qType === 1){
    questionHtml = '<div class="quiz-q">이 한자의 훈(뜻)은 무엇일까요?</div><div class="quiz-char">'+target.char+'</div>';
    correctVal = target.hun;
    const distractors = pickUnique(shuffle(pool.filter(p=>!targetHuns.includes(p.hun))).map(p=>p.hun), 3);
    choices = shuffle([correctVal, ...distractors]);
  } else {
    questionHtml = '<div class="quiz-q">다음 훈음에 맞는 한자를 고르세요</div><div class="quiz-char" style="font-size:1.8rem;">'+target.hun+' '+target.eum+'</div>';
    correctVal = target.char;
    // 훈·음이 완전히 같은 다른 한자(예: 現/顯 나타날 현)는 오답 보기에서 제외 → 정답 2개 문제 방지
    const distractors = pickUnique(shuffle(pool.filter(p=>p.char!==target.char && !(p.hun===target.hun && p.eum===target.eum))).map(p=>p.char), 3);
    choices = shuffle([correctVal, ...distractors]);
  }

  let html = questionHtml + '<div class="quiz-choices">';
  choices.forEach(c=>{
    html += '<div class="quiz-choice" data-val="'+encodeURIComponent(c)+'">'+c+'</div>';
  });
  html += '</div>';
  body.innerHTML = html;

  document.querySelectorAll('.quiz-choice').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(el.classList.contains('locked')) return;
      document.querySelectorAll('.quiz-choice').forEach(e=>e.classList.add('locked'));
      const val = decodeURIComponent(el.dataset.val);
      if(val === correctVal){
        el.classList.add('correct');
        quizCorrect++;
      } else {
        el.classList.add('wrong');
        document.querySelectorAll('.quiz-choice').forEach(e=>{
          if(decodeURIComponent(e.dataset.val) === correctVal) e.classList.add('correct');
        });
        markWrong(target);
      }
      setTimeout(()=>{ quizIdx++; renderQuizQuestion(); }, 900);
    });
  });
}

// ---------- stroke order ----------
let strokeSelected = null;
let hwInstance = null;

function buildStrokeList(){
  const list = document.getElementById('stroke-list');
  list.innerHTML = '';
  const data = getFilteredData();
  data.forEach(item=>{
    const el = document.createElement('div');
    el.className = 'stroke-item';
    el.textContent = item.char;
    el.addEventListener('click', ()=> selectStrokeChar(item, el));
    list.appendChild(el);
  });
}

function filterStrokeList(term){
  const list = document.getElementById('stroke-list');
  list.innerHTML='';
  const data = getFilteredData().filter(d=>
    d.char.includes(term) || d.hun.includes(term) || d.eum.includes(term)
  );
  data.forEach(item=>{
    const el = document.createElement('div');
    el.className = 'stroke-item';
    el.textContent = item.char;
    el.addEventListener('click', ()=> selectStrokeChar(item, el));
    list.appendChild(el);
  });
}
document.getElementById('stroke-search').addEventListener('input', (e)=>{
  filterStrokeList(e.target.value.trim());
});

// 한국식 자형 → hanzi-writer 수록 표준 자형 폴백 (필순 동일)
const GLYPH_FALLBACK = {"敎":"教","淸":"清","眞":"真","絶":"絕","飮":"飲","硏":"研","鄕":"鄉","爲":"為"};

function createStrokeWriter(item, ch, isFallback){
  const target = document.getElementById('stroke-target');
  target.innerHTML = '';
  hwInstance = HanziWriter.create(target, ch, {
    width: 280, height: 280,
    padding: 10,
    strokeAnimationSpeed: 1,
    delayBetweenStrokes: 200,
    showOutline: true,
    onLoadCharDataError: function(){
      const fb = GLYPH_FALLBACK[ch];
      if(!isFallback && fb){
        createStrokeWriter(item, fb, true);
        document.getElementById('stroke-info').innerHTML +=
          ' <span style="font-size:.75rem; color:var(--muted);">(필순은 표준 자형 ' + fb + ' 기준으로 표시)</span>';
      } else {
        target.innerHTML = '<div style="display:flex; align-items:center; justify-content:center; height:100%; color:var(--muted); font-size:.85rem;">이 글자의 필순 데이터를 불러올 수 없습니다.</div>';
        hwInstance = null;
      }
    }
  });
}

function selectStrokeChar(item, elRef){
  strokeSelected = item;
  document.querySelectorAll('.stroke-item').forEach(el=>el.classList.remove('sel'));
  if(elRef) elRef.classList.add('sel');
  const rds = (item.readings || []);
  const readingHtml = rds.length > 1
    ? rds.map(r=>'<span class="hun">'+r.hun+'</span> <span class="eum">'+r.eum+'</span>').join(' / ')
    : '<span class="hun">'+item.hun+'</span> <span class="eum">'+item.eum+'</span>';
  document.getElementById('stroke-info').innerHTML = readingHtml + ' · ' + item.level;
  createStrokeWriter(item, item.char, false);
}
document.getElementById('stroke-animate').addEventListener('click', ()=>{
  if(hwInstance) hwInstance.animateCharacter();
});
document.getElementById('stroke-quiz').addEventListener('click', ()=>{
  if(hwInstance) hwInstance.quiz();
});

// ---------- wrong list ----------
function renderWrongCount(){
  const n = Object.keys(wrongMap).length;
  const label = document.getElementById('wrong-count-label');
  if(label) label.textContent = n + '개';
}
function renderWrongTab(){
  renderWrongCount();
  const body = document.getElementById('wrong-body');
  const entries = Object.values(wrongMap).sort((a,b)=> b.count - a.count);
  if(entries.length === 0){
    body.innerHTML = '<div class="wrong-empty">아직 틀린 한자가 없어요.<br>플래시카드나 퀴즈에서 자동으로 쌓입니다.</div>';
    return;
  }
  let html = '<table class="wrong-table"><tr><th>한자</th><th>훈</th><th>음</th><th>급수</th><th>틀린 횟수</th><th></th></tr>';
  entries.forEach(e=>{
    html += '<tr><td style="font-size:1.3rem;">'+e.char+'</td><td>'+e.hun+'</td><td>'+e.eum+'</td><td>'+e.level+'</td><td>'+e.count+'</td>' +
      '<td><button class="link-btn" data-char="'+encodeURIComponent(e.char)+'">삭제</button></td></tr>';
  });
  html += '</table>';
  body.innerHTML = html;
  body.querySelectorAll('button.link-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      clearWrongOne(decodeURIComponent(b.dataset.char));
    });
  });
}
document.getElementById('wrong-clear').addEventListener('click', ()=>{
  if(confirm('오답노트를 전체 삭제할까요?')){
    wrongMap = {};
    saveWrong();
    renderWrongTab();
  }
});
document.getElementById('wrong-review').addEventListener('click', ()=>{
  const entries = Object.values(wrongMap);
  if(entries.length===0){ alert('오답노트가 비어 있습니다.'); return; }
  flashDeck = shuffle(entries.map(e => ALL_DATA.find(d=>d.char===e.char)).filter(Boolean));
  flashIndex = 0;
  document.querySelector('nav.tabs button[data-tab="flash"]').click();
  renderFlash();
});

// ---------- init ----------
renderSelectedCount();
renderFlash();
buildStrokeList();
renderWrongCount();
</script>
</body>
</html>
